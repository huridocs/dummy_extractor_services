# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: make install_venv

      - name: Start services in background
        run: make start-detached

      - name: Check API ready
        uses: emilioschepis/wait-for-endpoint@v1.0.3
        with:
          url: http://localhost:5051/info
          method: GET
          expected-status: 200
          timeout: 240000
          interval: 500

      - name: Test service endpoints
        run: |
          # Test main service endpoint
          curl -f http://127.0.0.1:5051/info
          # Test secondary service endpoint if it exists
          curl -f http://127.0.0.1:5056/info || echo "Secondary service not available"

      - name: Cleanup services
        if: always()
        run: |
          if [ -f service.pid ]; then
            kill $(cat service.pid) 2>/dev/null || true
            pkill -f "gunicorn.*app:app" || true
            pkill -f "worker_" || true
          fi

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Service Logs ==="
          cat service.log || echo "No service logs found"
